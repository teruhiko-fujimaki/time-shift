<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムシフト再生</title>
    <style>
        :root {
            --panel-bg: #2d2d2d;
            --accent-color: #4CAF50;
            --switch-color: #2196F3;
        }
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: flex-direction 0.3s ease;
        }
        body.layout-right { flex-direction: row; }
        body.layout-bottom { flex-direction: column; }

        #video-container {
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* 鏡（反転）モードをクラスで制御 */
        video.mirror {
            transform: scaleX(-1);
        }

        #controls {
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        body.layout-right #controls { width: 220px; height: 100%; }
        body.layout-bottom #controls { width: 100%; height: auto; }

        h2 { font-size: 1rem; margin: 0; color: var(--accent-color); }
        .setting-group { display: flex; flex-direction: column; gap: 5px; }
        
        .display-value { font-size: 1.5rem; text-align: center; font-weight: bold; margin: 2px 0; }
        input[type="range"] { width: 100%; height: 25px; cursor: pointer; }

        .btn {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #startBtn { background-color: var(--accent-color); color: white; }
        #switchBtn { background-color: var(--switch-color); color: white; }
        #stopBtn { background-color: #f44336; color: white; }

        .layout-toggle {
            display: flex;
            background: #444;
            border-radius: 6px;
            padding: 3px;
        }
        .layout-toggle button {
            flex: 1;
            background: none;
            border: none;
            color: #ccc;
            padding: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            border-radius: 4px;
        }
        .layout-toggle button.active {
            background: #666;
            color: white;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>
<body class="layout-right">

    <div id="video-container">
        <video id="playback" class="mirror" autoplay playsinline muted></video>
        <div id="statusBadge" class="status-badge">カメラじゅんびOK</div>
    </div>

    <div id="controls">
        <h2>タイムシフト</h2>
        
        <div class="setting-group">
            <label style="font-size:0.8rem;">さかのぼる時間</label>
            <div class="display-value"><span id="delaySeconds">10</span>秒</div>
            <input type="range" id="delayRange" min="5" max="15" value="10" step="1">
        </div>

        <button id="startBtn" class="btn">スタート！</button>
        <button id="switchBtn" class="btn">カメラをかえる</button>
        
        <button id="stopBtn" class="btn" style="display:none;">やりなおす</button>

        <div class="setting-group">
            <label style="font-size:0.8rem;">ボタンの場所</label>
            <div class="layout-toggle">
                <button id="btnRight" class="active">みぎ</button>
                <button id="btnBottom">した</button>
            </div>
        </div>

        <div style="font-size: 0.7rem; color: #777; margin-top: auto;">
            カメラを切りかえて さつえいできるよ
        </div>
    </div>

    <script>
        const videoElem = document.getElementById('playback');
        const delayRange = document.getElementById('delayRange');
        const delaySecondsDisplay = document.getElementById('delaySeconds');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusBadge = document.getElementById('statusBadge');
        const body = document.body;
        const btnRight = document.getElementById('btnRight');
        const btnBottom = document.getElementById('btnBottom');

        let chunks = [];
        let mediaRecorder = null;
        let currentFacingMode = "user"; // 初期値はインカメラ

        delayRange.addEventListener('input', () => {
            delaySecondsDisplay.textContent = delayRange.value;
        });

        // カメラ切り替え
        switchBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            // インカメラの時だけ鏡（反転）にする
            if (currentFacingMode === "user") {
                videoElem.classList.add('mirror');
            } else {
                videoElem.classList.remove('mirror');
            }
            statusBadge.textContent = "カメラをきりかえました";
        });

        btnRight.addEventListener('click', () => {
            body.className = 'layout-right';
            btnRight.classList.add('active');
            btnBottom.classList.remove('active');
        });
        btnBottom.addEventListener('click', () => {
            body.className = 'layout-bottom';
            btnBottom.classList.add('active');
            btnRight.classList.remove('active');
        });

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });

                startBtn.style.display = 'none';
                switchBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                delayRange.disabled = true;
                statusBadge.textContent = `${delayRange.value}秒ごに うごきだすよ`;

                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        chunks.push(e.data);
                        if (chunks.length >= delayRange.value && videoElem.paused) {
                            startPlayback();
                        }
                    }
                };
                mediaRecorder.start(1000);

            } catch (err) {
                alert("カメラがつかえませんでした。");
            }
        });

        function startPlayback() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            videoElem.src = URL.createObjectURL(blob);
            videoElem.play();
            statusBadge.textContent = "タイムシフトちゅう";
        }

        stopBtn.addEventListener('click', () => location.reload());
    </script>
</body>
</html>
