<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムシフト再生</title>
    <style>
        :root {
            --panel-bg: #2d2d2d;
            --accent-color: #4CAF50;
            --switch-color: #2196F3;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: flex-direction 0.3s ease;
        }

        body.layout-right {
            flex-direction: row;
        }

        body.layout-bottom {
            flex-direction: column;
        }

        #video-container {
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 鏡（反転）モードをクラスで制御 */
        video.mirror {
            transform: scaleX(-1);
        }
        /* プレビュー用のスタイル */
        #livePreview.mirror {
            transform: scaleX(-1);
        }

        /* プレビュー用のスタイル */
        #livePreview.mirror {
            transform: scaleX(-1);
        }

        #controls {
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        body.layout-right #controls {
            width: 220px;
            height: 100%;
        }

        body.layout-bottom #controls {
            width: 100%;
            height: auto;
        }

        h2 {
            font-size: 1rem;
            margin: 0;
            color: var(--accent-color);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .display-value {
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            margin: 2px 0;
        }

        input[type="range"] {
            width: 100%;
            height: 25px;
            cursor: pointer;
        }

        .btn {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #startBtn {
            background-color: var(--accent-color);
            color: white;
        }

        #switchBtn {
            background-color: var(--switch-color);
            color: white;
        }

        #stopBtn {
            background-color: #f44336;
            color: white;
        }

        .layout-toggle {
            display: flex;
            background: #444;
            border-radius: 6px;
            padding: 3px;
        }

        .layout-toggle button {
            flex: 1;
            background: none;
            border: none;
            color: #ccc;
            padding: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            border-radius: 4px;
        }

        .layout-toggle button.active {
            background: #666;
            color: white;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>

        function startRecording(delaySec) {
            mediaRecorder = new MediaRecorder(currentStream, { mimeType: mimeType });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    e.data.arrayBuffer().then(buffer => {
                        queue.push(buffer);
                        processQueue();
                        checkPlayStart(delaySec);
                    });
                }
            };

            // こまめにデータを取得（100msごと）
            mediaRecorder.start(100);
        }

        function processQueue() {
            if (queue.length > 0 && !isUpdating && mediaSource.readyState === 'open' && sourceBuffer && !sourceBuffer.updating) {
                isUpdating = true;
                const buffer = queue.shift();
                try {
                    sourceBuffer.appendBuffer(buffer);
                } catch (e) {
                    console.error("appendBuffer error:", e);
                    isUpdating = false;
                }
            }
        }

        function checkPlayStart(delaySec) {
            if (videoElem.paused && sourceBuffer && sourceBuffer.buffered.length > 0) {
                const bufferedDuration = sourceBuffer.buffered.end(0) - sourceBuffer.buffered.start(0);
                // 指定秒数＋少し余裕を持ってバッファされたら再生開始
                if (bufferedDuration >= delaySec) {
                    videoElem.play().then(() => {
                        statusBadge.textContent = "タイムシフトさいせいちゅう";
                        // 開始位置をバッファの先頭に合わせる
                        videoElem.currentTime = sourceBuffer.buffered.start(0);
                    }).catch(e => console.error("Play error:", e));
                } else {
                    statusBadge.textContent = `ためています... ${(bufferedDuration).toFixed(1)} / ${delaySec}秒`;
                }
            }
        }
